<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo Viens chop : concombre et coco-fesse">
  <defs>
    <linearGradient id="peach" gradientUnits="userSpaceOnUse" x1="12" y1="16" x2="46" y2="52">
      <stop offset="0%" stop-color="#FFB067"/>
      <stop offset="45%" stop-color="#FF5E1A"/>
      <stop offset="100%" stop-color="#FF1E56"/>
    </linearGradient>
    <linearGradient id="peachDark" gradientUnits="userSpaceOnUse" x1="32" y1="16" x2="32" y2="36">
      <stop offset="0%" stop-color="#F2521A"/>
      <stop offset="100%" stop-color="#D91A48"/>
    </linearGradient>
    <linearGradient id="cuke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FE86B"/>
      <stop offset="100%" stop-color="#2E9E3F"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BF077"/>
      <stop offset="100%" stop-color="#3FAE4A"/>
    </linearGradient>
  </defs>

  <!-- Coco-fesse : deux lobes + sillon -->
  <g>
    <!-- lobe gauche -->
    <circle cx="24.5" cy="31" r="14.5" fill="url(#peach)"/>
    <!-- lobe droit -->
    <circle cx="39.5" cy="31" r="14.5" fill="url(#peach)"/>
    <!-- bas arrondi qui soude les deux lobes -->
    <path d="M10 33c0 10.5 8.6 17.5 22 17.5S54 43.5 54 33z" fill="url(#peach)"/>
    <!-- ombre du sillon (relief) -->
    <path d="M32 17.5c-1.4 5.2-1.4 12.6 0 17.4 1.4-4.8 1.4-12.2 0-17.4z" fill="url(#peachDark)" opacity=".85"/>
    <!-- reflet -->
    <ellipse cx="22" cy="26" rx="4.4" ry="6" fill="#fff" opacity=".30" transform="rotate(-20 22 26)"/>
    <ellipse cx="41.5" cy="26.5" rx="3" ry="4.2" fill="#fff" opacity=".16" transform="rotate(18 41.5 26.5)"/>
  </g>

  <!-- Feuille -->
  <path d="M33 17c-.6-4.6 2-8 6.8-8.6.4 4.8-2.2 8.2-6.8 8.6z" fill="url(#leaf)"/>
  <path d="M32.6 17.4c1.8-2.6 3.7-4.4 6-5.4" fill="none" stroke="#2E9E3F" stroke-opacity=".5" stroke-width="1" stroke-linecap="round"/>

  <!-- Concombre posé en diagonale -->
  <g transform="rotate(-40 33 36)">
    <rect x="28.6" y="32" width="10.8" height="31" rx="5.4" fill="url(#cuke)"/>
    <rect x="28.6" y="32" width="10.8" height="31" rx="5.4" fill="none" stroke="#1F7A2E" stroke-opacity=".25" stroke-width="1"/>
    <g fill="#1F7A2E" opacity=".5">
      <circle cx="32" cy="38.5" r="1.15"/><circle cx="36.2" cy="42" r="1.15"/>
      <circle cx="31.6" cy="46" r="1.15"/><circle cx="36" cy="49.5" r="1.15"/>
      <circle cx="32.2" cy="53.4" r="1.15"/><circle cx="36.1" cy="56.6" r="1.15"/>
      <circle cx="31.8" cy="59.4" r="1.05"/>
    </g>
    <!-- extrémité coupée -->
    <ellipse cx="34" cy="34.6" rx="5.4" ry="2.9" fill="#B6F58E"/>
    <ellipse cx="34" cy="34.6" rx="2.6" ry="1.3" fill="#E9FFDA" opacity=".9"/>
  </g>
</svg>
